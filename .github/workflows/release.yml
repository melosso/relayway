name: Build and Push As Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. 2026.10.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  tag:
    name: Bump version and tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ inputs.tag_name }}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" Source/Directory.Build.props
          git add Source/Directory.Build.props
          git commit -m "chore: bump version to ${VERSION}" || echo "Version already set to ${VERSION}, nothing to commit"
          git push
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

  build:
    name: Build ${{ matrix.rid }}
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish application
        run: |
          dotnet publish Source/Relayway/Relayway.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o build-output

      - name: Create deployment structure
        run: |
          cp LICENSE build-output/LICENSE.txt
          echo "https://github.com/${{ github.repository }}" > build-output/source.txt
          if [ "${{ matrix.rid }}" = "win-x64" ]; then cp Relayway.xml build-output/; fi

      - name: Create version file
        run: |
          echo "${{ inputs.tag_name }}" > build-output/version.txt
          echo "Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> build-output/version.txt
          echo "Commit: $(git rev-parse HEAD)" >> build-output/version.txt

      - name: Create deployment archive
        run: |
          NAME="Relayway-${{ inputs.tag_name }}-${{ matrix.rid }}"
          cd build-output
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "../${NAME}.zip" .
          else
            tar -czf "../${NAME}.tar.gz" .
          fi
          cd ..
          sha256sum "${NAME}.${{ matrix.archive }}" > "${NAME}.${{ matrix.archive }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: relayway-${{ inputs.tag_name }}-${{ matrix.rid }}
          path: Relayway-${{ inputs.tag_name }}-${{ matrix.rid }}.*
          retention-days: 90

  image:
    needs: tag
    uses: ./.github/workflows/release-package.yml
    permissions:
      contents: read
      packages: write
    with:
      tag_name: ${{ inputs.tag_name }}

  release:
    name: Publish release
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: relayway-${{ inputs.tag_name }}-*
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          TAG="${{ inputs.tag_name }}"
          REPO="${{ github.server_url }}/${{ github.repository }}"

          git log ${PREV_TAG:+${PREV_TAG}..}HEAD --no-merges --format="%s by @%an in %h" \
            | grep -v '^chore: bump version to ' > commits.txt || true

          {
            echo "### What's Changed"
            for type in feat fix refactor security chore; do
              grep -E "^${type}(\(.*\))?!?:" commits.txt || true
            done
            grep -vE '^(feat|fix|refactor|security|chore)(\(.*\))?!?:' commits.txt || true
          } | sed '2,$s/^/* /' > release_notes.md

          echo "" >> release_notes.md
          echo "Image: \`ghcr.io/${{ github.repository }}:${TAG}\`" >> release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: ${REPO}/compare/${PREV_TAG}...${TAG}" >> release_notes.md
          else
            echo "**Full Changelog**: ${REPO}/commits/${TAG}" >> release_notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          body_path: release_notes.md
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
